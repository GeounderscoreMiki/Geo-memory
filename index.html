<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geo-Memory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <h1>🌲 Geo-Memory 🧭</h1>

        <p>
            Find alle 10 par fra naturens og geocachingens verden
        </p>
    </header>

    <main class="container">

        <section class="scoreboard">
            <p>
                Forsøg:
                <span id="forsog">0</span>
            </p>

            <p>
                Par fundet:
                <span id="par-fundet">0</span> / 10
            </p>
        </section>

        <section
            id="spilleplade"
            class="spilleplade"
            aria-label="Vendespil">
        </section>

        <button id="start-igen" type="button">
            Start spillet igen
        </button>

        <p id="besked" aria-live="polite"></p>

    </main>

    <script src="script.js"></script>
</body>
</html>Opdater spillets HTML
